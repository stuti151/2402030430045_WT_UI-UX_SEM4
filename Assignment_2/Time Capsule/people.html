<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

  <body>
    <div class="profile-container">
      <header class="header">
        <h1 class="logo">Time Capsule</h1>
        <nav>

            <li><a href="photo.html" class="nav-item">Photos</a></li>
            <li><a href="memories.html" class="nav-item">Memories</a></li>

      <section class="profile-info">
        <img

      <section class="photo-gallery" id="photos">
        <img

        />

          class="gallery-image"

        <img
          class="memory-image"
          src="img/vkb&w.png"
          alt="Virat Kohli memory 1"

        <img

        />
        <img
          class="memory-image"
          src="img/vkwicket.png"
          alt="Virat Kohli memory 3"
        />
        <img
          class="memory-image"
          src="img/vk18.png"
          alt="Virat Kohli memory 4"
        />
        <img
