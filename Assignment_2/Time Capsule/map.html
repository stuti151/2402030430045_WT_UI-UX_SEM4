<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Capsule Map</title>
    <link rel="stylesheet" href="css/globals.css" />
    <link rel="stylesheet" href="css/map.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="map">
      <div class="content">
        <header class="header">
          <h1 class="logo">Time Capsule</h1>
          <nav>
            <ul class="nav-list">
              <li><a href="photo.html" class="nav-item">Photos</a></li>
              <li><a href="memories.html" class="nav-item">Memories</a></li>
              <li><a href="collection.html" class="nav-item">Collection</a></li>
              <li><a href="add.html" class="nav-item">Add</a></li>
            </ul>
          </nav>
        </header>
        <section class="main-image">
          <img src="img/map.png" alt="Main map image" class="map-image" />
        </section>
        <section class="location-grid">
          <a href="place.html">
            <article class="location-item">
              <img
                src="img/ahme.png"
                alt="Ahmedabad"
                class="location-image"
              />
              <h2 class="location-name">Ahmedabad</h2>
              <p class="item-count">632 items</p>
            </article>
          </a>
          <article class="location-item">
            <img src="img/udaipur.png" alt="Udaipur" class="location-image" />
            <h2 class="location-name">Udaipur</h2>
            <p class="item-count">62 items</p>
          </article>
          <article class="location-item">
            <img
              src="img/korea.png"
              alt="South Korea"
              class="location-image"
            />
            <h2 class="location-name">South Korea</h2>
            <p class="item-count">152 items</p>
          </article>
          <article class="location-item">
            <img src="img/konkan.png" alt="Konkan" class="location-image" />
            <h2 class="location-name">Konkan</h2>
            <p class="item-count">200 items</p>
          </article>
          <article class="location-item">
            <img src="img/goa.png" alt="Goa" class="location-image" />
            <h2 class="location-name">Goa</h2>
            <p class="item-count">481 items</p>
          </article>
        </section>
      </div>
    </main>
  </body>
</html>
