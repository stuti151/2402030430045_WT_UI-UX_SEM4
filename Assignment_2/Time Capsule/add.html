<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Capsule</title>
    <link rel="stylesheet" href="css/globals.css" />
    <link rel="stylesheet" href="css/add.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="add">
      <header class="header">
        <h1 class="logo">Time Capsule</h1>
        <nav>
          <ul class="nav-list">
            <li><a href="photo.html" class="nav-item">Photos</a></li>
            <li><a href="memories.html" class="nav-item">Memories</a></li>
            <li><a href="collection.html" class="nav-item">Collection</a></li>
            <li><a href="add.html" class="nav-item">Add</a></li>
          </ul>
        </nav>
      </header>
      <section class="gallery">
        <div
          class="gallery-item"
          style="background-image: url(./img/girl.png)"
        ></div>
        <div
          class="gallery-item"
          style="background-image: url(./img/animal.png)"
        ></div>
        <div
          class="gallery-item"
          style="background-image: url(./img/cafe.png)"
        ></div>
        <div
          class="gallery-item"
          style="background-image: url(./img/silk.png)"
        ></div>
        <div
          class="gallery-item"
          style="background-image: url(./img/mountain.png)"
        ></div>
      </section>
      <section class="create-section">
        <h2 class="section-title">Create new collage</h2>
        <div class="collage-preview">
          <img
            src="img/pic1.png"
            alt="Collage preview 1"
            class="collage-image"
          />
          <img
            src="img/pic2.png"
            alt="Collage preview 2"
            class="collage-image"
          />
        </div>
      </section>
      <section class="add-photos-section">
        <h2 class="section-title">Add new photos</h2>
        <div class="photo-grid">
          <img src="img/pic4.png" alt="Photo 1" class="photo-item" />
          <img src="img/pic5.png" alt="Photo 2" class="photo-item" />
          <div class="photo-item add-photo">
            <span class="add-icon">+</span>
          </div>
        </div>
        <div class="additional-photos">
          <img
            src="img/pic3.png"
            alt="Additional photo"
            class="photo-item"
          />
          <div class="photo-item add-photo">
            <span class="add-icon">+</span>
          </div>
        </div>
      </section>
      <section class="add-people-section">
        <h2 class="section-title">Add new Peoples</h2>
        <div class="people-grid">
          <img src="img/people.png" alt="Person 1" class="person-item" />
          <img src="img/people2.png" alt="Person 2" class="person-item" />
          <img src="img/people3.png" alt="Person 3" class="person-item" />
          <div class="person-item add-person">
            <span class="add-icon">+</span>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
