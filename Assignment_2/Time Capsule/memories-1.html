<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Capsule - Photo Memories</title>
    <link rel="stylesheet" href="css/globals.css" />
    <link rel="stylesheet" href="css/memories-1.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="desktop">
      <header class="header">
        <h1 class="logo">Time Capsule</h1>
        <nav>
          <ul class="nav-list">
            <li><a href="photo.html" class="nav-item">Photos</a></li>
            <li><a href="memories.html" class="nav-item">Memories</a></li>
            <li><a href="collection.html" class="nav-item">Collection</a></li>
            <li><a href="add.html" class="nav-item">Add</a></li>
          </ul>
        </nav>
      </header>
      <section class="photo-section">
        <h2 class="section-title">On this day last year</h2>
        <div class="photo-grid">
          <img
            class="photo"
            src="img/girl.png"
            alt="Memory from last year 1"
          />
          <img
            class="photo"
            src="img/animal.png"
            alt="Memory from last year 2"
          />
          <img
            class="photo"
            src="img/cafe.png"
            alt="Memory from last year 3"
          />
          <img
            class="photo"
            src="img/silk.png"
            alt="Memory from last year 4"
          />
          <img
            class="photo"
            src="img/mountain.png"
            alt="Memory from last year 5"
          />
        </div>
      </section>
      <section class="photo-section">
        <h2 class="section-title">Memories from 2015</h2>
        <div class="photo-grid">
          <img class="photo" src="img/image.png" alt="Memory from 2015 1" />
          <img class="photo" src="img/image-9.png" alt="Memory from 2015 2" />
          <img class="photo" src="img/image-2.png" alt="Memory from 2015 3" />
          <img class="photo" src="img/image-4.png" alt="Memory from 2015 4" />
          <img class="photo" src="img/image-3.png" alt="Memory from 2015 5" />
        </div>
      </section>
    </div>
  </body>
</html>
