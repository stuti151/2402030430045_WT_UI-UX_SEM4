<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Capsule Collection</title>
    <link rel="stylesheet" href="css/globals.css" />
    <link rel="stylesheet" href="css/collection.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="collection">
      <header class="header">
        <h1 class="logo">Time Capsule</h1>
        <nav>
          <ul class="nav-list">
            <li><a href="photo.html" class="nav-item">Photos</a></li>
            <li><a href="memories.html" class="nav-item">Memories</a></li>
            <li><a href="collection.html" class="nav-item">Collection</a></li>
            <li><a href="add.html" class="nav-item">Add</a></li>
          </ul>
        </nav>
      </header>
      <main class="main-content">
        <section class="photo-gallery">
          <img
            src="img/girl.png"
            alt="Gallery image 1"
            class="photo-gallery__item"
          />
          <img
            src="img/animal.png"
            alt="Gallery image 2"
            class="photo-gallery__item"
          />
          <img
            src="img/cafe.png"
            alt="Gallery image 3"
            class="photo-gallery__item"
          />
          <img
            src="img/silk.png"
            alt="Gallery image 4"
            class="photo-gallery__item"
          />
          <img
            src="img/mountain.png"
            alt="Gallery image 5"
            class="photo-gallery__item"
          />
        </section>
        <section class="categories">
          <div class="category">
            <h2 class="category__title">Peoples</h2>
            <div class="category__content category__content--people">
              <a href="people.html">
                <img
                  src="img/vkprpi.png"
                  alt="Person 1"
                  class="category__image"
                />
              </a>
              <img
                src="img/aunty.png"
                alt="Person 2"
                class="category__image"
              />
              <img
                src="img/uncle.png"
                alt="Person 3"
                class="category__image"
              />
              <img
                src="img/uncle2.png"
                alt="Person 4"
                class="category__image"
              />
            </div>
          </div>
          <div class="category">
            <h2 class="category__title">On this device</h2>
            <div class="category__content category__content--device">
              <img
                src="img/vkindia.png"
                alt="Device image 1"
                class="category__image"
              />
              <img
                src="img/momboy.png"
                alt="Device image 2"
                class="category__image"
              />
              <img
                src="img/restorant.png"
                alt="Device image 3"
                class="category__image"
              />
              <img
                src="img/restorant.png"
                alt="Device image 4"
                class="category__image"
              />
            </div>
          </div>
          <div class="category">
            <h2 class="category__title">Places</h2>
            <a href="map.html">
              <div class="category__content category__content--places">
                <img
                  src="img/place1.png"
                  alt="Place 1"
                  class="category__image"
                />
                <img
                  src="img/place2.png"
                  alt="Place 2"
                  class="category__image"
                />
                <img
                  src="img/place3.png"
                  alt="Place 3"
                  class="category__image"
                />
                <img
                  src="img/place4.png"
                  alt="Place 4"
                  class="category__image"
                />
              </div>
            </a>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
