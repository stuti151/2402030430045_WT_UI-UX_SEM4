<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Capsule Photos</title>
    <link rel="stylesheet" href="css/globals.css" />
    <link rel="stylesheet" href="css/photo.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="photos">
      <div class="content">
        <header class="header">
          <h1 class="logo">Time Capsule</h1>
          <nav>
            <ul class="nav-list">
              <li><a href="photo.html" class="nav-item">Photos</a></li>
              <li><a href="memories.html" class="nav-item">Memories</a></li>
              <li><a href="collection.html" class="nav-item">Collection</a></li>
              <li><a href="add.html" class="nav-item">Add</a></li>
            </ul>
          </nav>
        </header>
        <section class="photo-gallery">
          <h2 class="section-title">Today</h2>
          <div class="photo-grid">
            <img class="photo" src="img/girl.png" alt="Today's photo 1" />
            <img class="photo" src="img/animal.png" alt="Today's photo 2" />
            <img class="photo" src="img/cafe.png" alt="Today's photo 3" />
            <img class="photo" src="img/silk.png" alt="Today's photo 4" />
            <img class="photo" src="img/mountain.png" alt="Today's photo 5" />
          </div>
          <h2 class="section-title">Yesterday</h2>
          <div class="photo-grid small-photos">
            <img
              class="photo"
              src="img/book.png"
              alt="Yesterday's photo 1"
            />
            <img
              class="photo"
              src="img/momboy.png"
              alt="Yesterday's photo 2"
            />
            <img
              class="photo"
              src="img/momgirl.png"
              alt="Yesterday's photo 3"
            />
            <img
              class="photo"
              src="img/school.png"
              alt="Yesterday's photo 4"
            />
            <img
              class="photo"
              src="img/cloud.png"
              alt="Yesterday's photo 5"
            />
            <img
              class="photo"
              src="img/man.png"
              alt="Yesterday's photo 6"
            />
            <img
              class="photo"
              src="img/couple.png"
              alt="Yesterday's photo 7"
            />
            <img
              class="photo"
              src="img/moon.png"
              alt="Yesterday's photo 8"
            />
            <img
              class="photo"
              src="img/ladygaga.png"
              alt="Yesterday's photo 9"
            />
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
