<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Capsule Memories</title>
    <link rel="stylesheet" href="css/globals.css" />
    <link rel="stylesheet" href="css/memories.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="memories">
      <header class="header">
        <h1 class="logo">Time Capsule</h1>
        <nav>
          <ul class="nav-list">
            <li><a href="photo.html" class="nav-item">Photos</a></li>
            <li><a href="memories.html" class="nav-item">Memories</a></li>
            <li><a href="collection.html" class="nav-item">Collection</a></li>
            <li><a href="add.html" class="nav-item">Add</a></li>
          </ul>
        </nav>
      </header>
      <main class="main-content">
        <section class="photo-grid">
          <article
            class="photo-item"
            style="background-image: url(img/girl.png)"
          ></article>
          <article
            class="photo-item"
            style="background-image: url(img/animal.png)"
          ></article>
          <article
            class="photo-item"
            style="background-image: url(img/cafe.png)"
          ></article>
          <article class="photo-item">
            <img src="img/silk.png" alt="Memory photo" class="photo-image" />
          </article>
          <article class="photo-item">
            <img
              src="img/mountain.png"
              alt="Memory photo"
              class="photo-image"
            />
          </article>
        </section>
        <section class="memories-section">
          <h2 class="section-title">Add more memories?</h2>
          <div class="memories-grid">
            <article class="memory-item">
              <img
                src="img/girl.png"
                alt="Memory item"
                class="memory-image"
              />
            </article>
            <article class="memory-item">
              <img
                src="img/animal.png"
                alt="Memory item"
                class="memory-image"
              />
            </article>
            <article class="memory-item">
              <img
                src="img/cafe.png"
                alt="Memory item"
                class="memory-image"
              />
            </article>
            <a href="memories-1.html">
              <article class="memory-item add-memory">
                <span class="add-icon">+</span>
              </article>
            </a>
          </div>
        </section>
        <section class="history-section">
          <h2 class="section-title">History</h2>
          <div class="history-grid">
            <article class="history-item">
              <img
                src="img/silk.png"
                alt="History item"
                class="history-image"
              />
            </article>
            <article class="history-item">
              <img
                src="img/girl2.png"
                alt="History item"
                class="history-image"
              />
            </article>
            <article class="history-item">
              <img
                src="img/mountain2.png"
                alt="History item"
                class="history-image"
              />
            </article>
            <article class="history-item">
              <img
                src="img/girl3.png"
                alt="History item"
                class="history-image"
              />
            </article>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
